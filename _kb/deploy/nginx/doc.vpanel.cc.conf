# deploysvr 宿主 nginx vhost —— doc.vpanel.cc（个人知识库）
#
# 链路：用户 → DNS(灰云) → deploysvr 80/443（本 vhost + certbot TLS）→ 127.0.0.1:3456（web 容器）
# api 容器不对外暴露，浏览器经 web 的 /api/v1 同源代理访问。
#
# 安装：
#   cp _kb/deploy/nginx/doc.vpanel.cc.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/doc.vpanel.cc.conf /etc/nginx/sites-enabled/
#   certbot certonly --webroot -w /var/www/certbot -d doc.vpanel.cc
#   nginx -t && systemctl reload nginx

upstream kb_web {
    server 127.0.0.1:3456;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name doc.vpanel.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doc.vpanel.cc;

    ssl_certificate     /etc/letsencrypt/live/doc.vpanel.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doc.vpanel.cc/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # 后端上限 200MB，这里留余量；小于它会在 nginx 层就 413，用户看不到后端的中文提示
    client_max_body_size 210m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Next 构建产物：内容哈希文件名，强缓存
    location /_next/static/ {
        proxy_pass http://kb_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 摄取进度 SSE：必须关缓冲，否则事件被攒着一次性吐出，进度条形同虚设。
    # 读超时给足：一次摄取可能跑十几分钟，期间连接必须保持。
    location ~ ^/api/v1/jobs/[^/]+/events$ {
        proxy_pass http://kb_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # 文档上传：关请求缓冲，让 200MB 直接流到后端，避免 nginx 先落盘一份
    location = /api/v1/jobs {
        proxy_pass http://kb_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 语义问答走图谱+向量混合检索，实测 30-60 秒，默认 60s 读超时会掐断
    location = /api/v1/kg/query {
        proxy_pass http://kb_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://kb_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
