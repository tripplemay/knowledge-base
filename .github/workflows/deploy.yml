name: Deploy

# 只在 main 通过 CI 后部署；也可手动触发
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # 部署不打断，排队执行

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ghcr.io/${{ github.repository }}/kb-web
  IMAGE_API: ghcr.io/${{ github.repository }}/kb-api

jobs:
  build-push:
    name: 构建并推送镜像
    # workflow_run 触发时必须显式确认 CI 是成功的，否则失败的 CI 也会触发部署
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./_kb
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: 前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: 部署到 VPS
    needs: build-push
    runs-on: ubuntu-latest
    environment: production # 可在仓库设置里给它加人工审批
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 同步 compose 配置到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.yml,_kb/config.yaml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: 拉取镜像并滚动重启
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # 镜像标签钉到本次提交，避免 latest 漂移导致回滚困难
            export KB_IMAGE_API="${{ env.IMAGE_API }}:${{ needs.build-push.outputs.sha }}"
            export KB_IMAGE_WEB="${{ env.IMAGE_WEB }}:${{ needs.build-push.outputs.sha }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

            # 就地验收：web 起来 + 代理能拿到后端数据 + 跨站被拒
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${KB_WEB_PORT:-3456}/admin/kb/domains" || true)
              [ "$code" = "200" ] && break
              sleep 3
            done
            [ "$code" = "200" ] || { echo "❌ web 未就绪（$code）"; docker compose logs --tail=60; exit 1; }

            proxy=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${KB_WEB_PORT:-3456}/api/v1/jobs")
            [ "$proxy" = "200" ] || { echo "❌ 摄取代理异常（$proxy）"; docker compose logs --tail=60 api; exit 1; }

            cross=$(curl -s -o /dev/null -w '%{http_code}' -H 'Sec-Fetch-Site: cross-site' \
                    "http://127.0.0.1:${KB_WEB_PORT:-3456}/api/v1/jobs")
            [ "$cross" = "403" ] || { echo "❌ 跨站防护失效（$cross）"; exit 1; }

            echo "✅ 部署完成：$KB_IMAGE_WEB"
