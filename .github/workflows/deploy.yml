name: Deploy

# 只在 main 通过 CI 后部署；也可手动触发
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # 部署不打断，排队执行

jobs:
  deploy:
    name: 部署到 deploysvr
    # workflow_run 触发时必须显式确认 CI 成功，否则失败的 CI 也会触发部署
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # 可在仓库设置里给它加人工审批
    steps:
      - name: 拉取代码、重建并验收
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          # 部署逻辑在仓库里（_kb/deploy/remote-deploy.sh），这里只发一行命令：
          # 多行脚本经 ssh-action 传输容易被 shell 解析规则绊住，且无法在服务器上单独调试
          script: DEPLOY_DIR='${{ secrets.DEPLOY_PATH }}' bash '${{ secrets.DEPLOY_PATH }}/_kb/deploy/remote-deploy.sh'
